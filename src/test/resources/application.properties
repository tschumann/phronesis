# turn off the default connect to Flyway - we'll handle that ourselves
spring.flyway.enabled=false

# log what happens with unsuccessful requests
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

spring.datasource.url=jdbc:h2:file:${user.dir}\\database-test
spring.datasource.driverClassName=org.h2.Driver
# TODO: specify these some other way?
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# allow access to jdbc:h2:file:./database-test via http://localhost:8080/h2-console/
spring.h2.console.enabled=true
